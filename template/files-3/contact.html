<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - GreenLeaf Hotel</title>
  <link rel="stylesheet" href="website.css" />
</head>
<body>
  <header class="website-header">
    <div class="container">
      <h1>GreenLeaf Hotel</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="booking.html">Book Now</a>
        <a href="about.html">About Us</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>
  <section class="container">
    <h2>Contact Us</h2>
    <div class="contact-info">
      <div>
        <p><b>Address:</b> 123 Main St, Downtown, City</p>
        <p><b>Phone:</b> +1 123 456 7890</p>
        <p><b>Email:</b> info@greenleafhotel.com</p>
      </div>
      <form class="contact-form">
        <label>Name
          <input type="text" name="name" required>
        </label>
        <label>Email
          <input type="email" name="email" required>
        </label>
        <label>Message
          <textarea name="message" rows="4" required></textarea>
        </label>
        <button type="submit" class="primary-btn">Send Message</button>
      </form>
    </div>
    <div class="map-section">
      <iframe src="https://maps.google.com/maps?q=123 Main St, City&t=&z=15&ie=UTF8&iwloc=&output=embed" width="100%" height="220" frameborder="0" style="border-radius:9px;"></iframe>
    </div>
  </section>
  <footer class="website-footer">
    <div class="container">
      <span>&copy; 2025 GreenLeaf Hotel. All Rights Reserved.</span>
    </div>
  </footer>
</body>
</html>
