<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Client - BizManager</title>
  <link rel="stylesheet" href="admin-template.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <!-- ...Sidebar HTML as in your admin template... -->
  </div>
  <div class="main">
    <header>
      <div class="header-left"><h1>Edit Client</h1></div>
    </header>
    <section class="main-content">
      <form class="form-section" autocomplete="off">
        <h2>Client Information</h2>
        <label>Name <input type="text" name="name" required class="input" value="Acme Corp"/></label>
        <label>Email <input type="email" name="email" required class="input" value="contact@acme.com"/></label>
        <label>Phone <input type="text" name="phone" class="input" value="+1 111 222 3333"/></label>
        <button class="primary-btn" type="submit">Update Client</button>
      </form>
    </section>
    <footer>&copy; 2025 BizManager. All rights reserved.</footer>
  </div>
</body>
</html>
