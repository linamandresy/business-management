<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports - BizManager Admin</title>
  <link rel="stylesheet" href="admin-template.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>BizManager</h2>
      <button class="collapse-btn" id="collapseBtn"><span class="icon-menu"></span></button>
    </div>
    <nav>
      <div class="nav-group"><a class="root-menu" href="admin-dashboard.html"><span class="icon-dashboard"></span><span class="nav-text">Dashboard</span></a></div>
      <div class="nav-group has-children">
        <a class="root-menu" href="#" data-toggle="clients"><span class="icon-clients"></span><span class="nav-text">Clients</span><span class="arrow"></span></a>
        <div class="submenu">
          <a href="admin-clients-list.html">All Clients</a>
          <a href="admin-clients-create.html">Add New Client</a>
        </div>
      </div>
      <div class="nav-group has-children">
        <a class="root-menu" href="#" data-toggle="rooms"><span class="icon-products"></span><span class="nav-text">Rooms</span><span class="arrow"></span></a>
        <div class="submenu">
          <a href="admin-rooms-list.html">All Rooms</a>
          <a href="admin-rooms-create.html">Add Room</a>
        </div>
      </div>
      <div class="nav-group has-children">
        <a class="root-menu" href="#" data-toggle="bookings"><span class="icon-sales"></span><span class="nav-text">Bookings</span><span class="arrow"></span></a>
        <div class="submenu">
          <a href="admin-bookings-list.html">All Bookings</a>
          <a href="admin-bookings-create.html">Add Booking</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="root-menu" href="admin-calendar.html"><span class="icon-invoices"></span><span class="nav-text">Calendar</span></a>
      </div>
      <div class="nav-group">
        <a class="root-menu active" href="admin-reports.html"><span class="icon-reports"></span><span class="nav-text">Reports</span></a>
      </div>
      <div class="nav-group">
        <a class="root-menu" href="admin-users-list.html"><span class="icon-users"></span><span class="nav-text">Users</span></a>
      </div>
      <div class="nav-group">
        <a class="root-menu" href="admin-settings.html"><span class="icon-settings"></span><span class="nav-text">Settings</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <span class="nav-text">Admin</span>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>
  <div class="main">
    <header>
      <div class="header-left"><h1>Reports</h1></div>
    </header>
    <section class="main-content">
      <div class="panel">
        <div class="panel-header">Revenue Report</div>
        <canvas id="revenueReport" height="100"></canvas>
      </div>
      <div class="panel">
        <div class="panel-header">Occupancy Rate</div>
        <canvas id="occupancyReport" height="100"></canvas>
      </div>
      <div class="panel">
        <div class="panel-header">Booking Trends</div>
        <canvas id="bookingReport" height="100"></canvas>
      </div>
    </section>
    <footer>
      &copy; 2025 BizManager. All rights reserved.
    </footer>
  </div>
  <script>
    // Sidebar collapse/expand and menu
    const sidebar = document.getElementById('sidebar');
    const collapseBtn = document.getElementById('collapseBtn');
    collapseBtn.addEventListener('click', function() {
      sidebar.classList.toggle('collapsed');
    });
    document.querySelectorAll('.nav-group.has-children > .root-menu').forEach(menu => {
      menu.addEventListener('click', function(e) {
        e.preventDefault();
        const group = this.closest('.nav-group');
        group.classList.toggle('open');
        document.querySelectorAll('.nav-group.has-children').forEach(g => {
          if(g !== group) g.classList.remove('open');
        });
      });
    });

    // Reports charts
    new Chart(document.getElementById('revenueReport'), {
      type: 'bar',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
        datasets: [{
          label: 'Revenue ($)',
          data: [2500, 3400, 3200, 4100, 3900, 4300, 4800],
          backgroundColor: '#5bb49a',
          borderRadius: 7,
        }]
      },
      options: { plugins: { legend: {display: false} }, scales: { y: { beginAtZero: true } } }
    });
    new Chart(document.getElementById('occupancyReport'), {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
        datasets: [{
          label: 'Occupancy (%)',
          data: [65, 68, 72, 75, 78, 80, 83],
          fill: true,
          backgroundColor: 'rgba(91,180,154,0.1)',
          borderColor: '#5bb49a',
          tension: 0.4,
          pointRadius: 4,
          pointBackgroundColor: '#5bb49a'
        }]
      },
      options: { plugins: { legend: {display: false} }, scales: { y: { beginAtZero: true } } }
    });
    new Chart(document.getElementById('bookingReport'), {
      type: 'doughnut',
      data: {
        labels: ['Direct', 'Online', 'Agency', 'Walk-in'],
        datasets: [{
          data: [120, 220, 90, 40],
          backgroundColor: ['#5bb49a', '#b9dbd6', '#379a7c', '#1b3934']
        }]
      },
      options: { plugins: { legend: { position: 'bottom', labels: { color: '#1b3934' } } } }
    });
  </script>
</body>
</html>
