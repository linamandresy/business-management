<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - BizManager Admin</title>
  <link rel="stylesheet" href="admin-template.css" />
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <form class="login-form" autocomplete="off">
      <h1>Sign Up</h1>
      <p class="login-welcome">Create your BizManager admin account.</p>
      <label>
        <span>Full Name</span>
        <input type="text" placeholder="Enter your name" required />
      </label>
      <label>
        <span>Email</span>
        <input type="email" placeholder="Enter your email" required />
      </label>
      <label>
        <span>Password</span>
        <input type="password" placeholder="Create a password" required />
      </label>
      <label>
        <span>Confirm Password</span>
        <input type="password" placeholder="Confirm your password" required />
      </label>
      <button type="submit" class="primary-btn login-btn">Sign Up</button>
      <div class="login-footer">
        <a href="admin-login.html">Already have an account?</a>
      </div>
    </form>
  </div>
</body>
</html>
